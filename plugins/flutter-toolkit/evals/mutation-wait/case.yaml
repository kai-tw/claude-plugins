schema_version: "1.1"
name: mutation-wait
description: plan-mutation --wait blocks in one call until the run ends (at most PLAN_MUTATION_WAIT seconds) and takes no slot; returns 1 if still running, 0 when ended, 3 if the run was killed and left its marker.
tags: [plan-mutation]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s" PLAN_TEST_SLOTS=0; plan-mutation --wait; echo "none: rc=$?"; sleep 30 & p=$!; PLAN_MUTATION_WAIT=1 plan-mutation --wait $p; echo "busy: rc=$?"; kill $p; bash run.sh & sleep 1; s=$SECONDS; plan-mutation --wait; echo "ended: rc=$? t=$((SECONDS-s))"; echo "pid: 999999" > .mutation-in-progress; plan-mutation --wait 2>&1; echo "killed: rc=$?"
  prompt: |
    Run plan-mutation --wait in four cases: no run, run still going, run ended normally, run killed leaving its marker. Print each exit code.
context:
  scaffold_script: fixture.sh
