schema_version: "1.1"
name: test-gate
description: 裸的 flutter test 被擋並指向 plan-test（原樣帶參數）；只是提到字樣的指令放行。
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: "$root/hooks/test-gate.sh" < bare.json; "$root/hooks/test-gate.sh" < mention.json; echo "quiet=$?"
  prompt: |
    對 test-gate hook 餵兩個指令：一個直接跑 flutter test，一個只是 echo 字樣再跑 plan-test；印出 hook 的輸出。
context:
  scaffold_script: fixture.sh
