schema_version: "1.1"
name: exec-slots
description: --slots n takes n slots at once, and holds none if it cannot get them all; more than the total or a non-integer is rejected outright.
tags: [plan-test]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s" PLAN_TEST_SLOTS=2 PLAN_TEST_WAIT=0; plan-test --slots 2 --exec sh -c "echo held=\$(ls s | paste -sd, -)"; echo "after_two=$(ls s | wc -l | xargs)"; plan-test --slots 3 --exec true; echo "over=$?"; plan-test --slots x --exec true; echo "bad=$?"; mkdir -p s/slot-1; echo "pid=$$" > s/slot-1/meta; plan-test --slots 2 --exec true; echo "busy=$? left=$(ls s | paste -sd, -)"; plan-test --exec echo one-ran; plan-mutation --workers 3 -- true; echo "workers=$?"
  prompt: |
    With a budget of 2 slots: run a command with --slots 2 and list the held slots; then try --slots 3 and --slots x; then hold slot-1 by hand and try --slots 2 and a single-slot --exec. Print the result of each step.
context:
  scaffold_script: fixture.sh
