schema_version: "1.1"
name: coverage-throw
description: throw const has no DA record; a branch-coverage BRDA of 0 counts as a gap, throw branches in ?? / ternary expressions are blocked, and fully executed files pass.
tags: [plan-coverage]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s" PLAN_TEST_WAIT=0 PLAN_QA_REPORT_DIR="$PWD"; plan-coverage --files lib/a.dart lib/b.dart lib/c.dart -- bash fake_test.sh; echo "rc=$?"; rm -rf coverage; plan-coverage --files lib/c.dart -- bash fake_test.sh; echo "clean=$?"
  prompt: |
    Run plan-coverage with a fake test command that writes a fixed lcov: first measure three files, then only the fully executed lib/c.dart. Print both outputs and exit codes.
context:
  scaffold_script: fixture.sh
