schema_version: "1.1"
name: coverage-queue-no-slot-dir
description: With TEST_QUEUE_DIR at a path where no directory can be made, plan-coverage warns once that it runs without a test slot, runs the test command exactly once and passes, and finishes instead of running itself again without end.
tags: [plan-coverage]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh
  prompt: |
    Point TEST_QUEUE_DIR under /dev/null and run plan-coverage on one file, stopping it after 15 seconds if it is still running. Print whether it finished, its exit code, how many times the test command ran, how many WARNING lines it printed and whether any of its processes is left running.
context:
  scaffold_script: fixture.sh
