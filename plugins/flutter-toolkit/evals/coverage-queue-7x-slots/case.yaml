schema_version: "1.1"
name: coverage-queue-7x-slots
description: With no TEST_QUEUE_DIR set, plan-coverage counts a slot a 7.x plan-test wrote in $HOME/.claude/.flutter-toolkit/slots, refusing while its holder lives and naming it, and reaps it once the holder's process is gone, then runs and leaves no slot behind.
tags: [plan-coverage]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh
  prompt: |
    With HOME in the workspace and one test slot, write that slot as a 7.x plan-test does, first for a live process and then for a dead one, and run plan-coverage on one file after each. Print each output, exit code, whether the test command ran and the slots left afterwards.
context:
  scaffold_script: fixture.sh
