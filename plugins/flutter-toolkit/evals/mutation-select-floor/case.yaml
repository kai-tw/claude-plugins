schema_version: "1.1"
name: mutation-select-floor
description: When pubspec.lock resolves dart_mutants 0.3.1, plan-mutation --select-by-coverage does not run, blocks with exit 2 and requires 0.4.0, because in 0.3.1 a single test-file failure during the coverage scan makes every mutant run the full suite, and the run carries on.
tags: [plan-mutation]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s" PLAN_TEST_WAIT=0 PLAN_MUTATION_ENGINE_REPO="$PWD/none"; plan-mutation --select-by-coverage --files lib/a.dart -- flutter test; echo "rc=$?"
  prompt: |
    Run plan-mutation --select-by-coverage in a project whose lock file resolves dart_mutants 0.3.1; print the output and exit code.
context:
  scaffold_script: fixture.sh
