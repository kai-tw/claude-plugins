schema_version: "1.1"
name: mutation-engine-floor
description: When pubspec.lock resolves dart_mutants 0.3.0, plan-mutation does not run and blocks with exit 2, explaining that the old version leaves flutter_tools scratch directories in the system temp area until the disk fills, and requires 0.3.1.
tags: [plan-mutation]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s" PLAN_TEST_WAIT=0 PLAN_MUTATION_ENGINE_REPO="$PWD/none"; plan-mutation --files lib/a.dart -- flutter test; echo "rc=$?"
  prompt: |
    Run plan-mutation in a project whose lock file resolves dart_mutants 0.3.0; print the output and exit code.
context:
  scaffold_script: fixture.sh
