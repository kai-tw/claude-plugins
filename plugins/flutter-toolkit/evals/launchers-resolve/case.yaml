schema_version: "1.1"
name: launchers-resolve
description: The plan-coverage launcher resolves to the implementation under skills/flutter-testing/scripts.
tags: [launchers]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: plan-coverage --help 2>&1 | head -1; echo "exit=$?"
  prompt: |
    Print the first line of plan-coverage --help.
context:
  scaffold_script: fixture.sh
