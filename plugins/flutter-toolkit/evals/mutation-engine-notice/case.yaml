schema_version: "1.1"
name: mutation-engine-notice
description: lock 檔在下限以上、但 kai-packages 已有更新的 dart_mutants 時，plan-mutation 提醒升級並照常跑；指令依專案類型給 flutter pub get 或 dart pub get；已是最新就不出聲。
tags: [plan-mutation]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s" PLAN_TEST_WAIT=0; w=$PWD; for p in flutter dart same; do r=engine; [ $p = same ] && r=engine-same; (cd $p && PLAN_MUTATION_ENGINE_REPO="$w/$r" plan-mutation --files lib/a.dart -- flutter test 2>&1; echo "rc=$?") | sed "s/^/$p: /"; done
  prompt: |
    對三個 lock 檔解析到 dart_mutants 0.3.1 的專案跑 plan-mutation：Flutter 與純 Dart 專案各落後一版，另一個已是最新。印出輸出與結束碼。
context:
  scaffold_script: fixture.sh
