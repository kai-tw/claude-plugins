schema_version: "1.1"
name: mutation-background
description: A long plan-mutation run starts with the Bash tool's run_in_background, which the harness tracks and wakes the session on; the skill names it and forbids `&`, nohup, disown and setsid, and plan-mutation has no blocking --wait to hold the conversation.
tags: [plan-mutation]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PLAN_TEST_DIR="$PWD/s"; f="$root/skills/test-gates/SKILL.md"; grep -c "run_in_background: true" "$f" | sed "s/^/named=/"; grep -c "nohup" "$f" | sed "s/^/forbids=/"; grep -c -- "--wait" "$f" | sed "s/^/wait-doc=/"; plan-mutation --wait >/dev/null 2>&1; echo "wait-flag: rc=$?"
  prompt: |
    Check that the test-gates skill tells a long plan-mutation run to start with run_in_background and never nohup, that it no longer documents --wait, and print the exit code of plan-mutation --wait.
context:
  scaffold_script: fixture.sh
