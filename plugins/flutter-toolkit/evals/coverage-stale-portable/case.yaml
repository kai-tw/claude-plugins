schema_version: "1.1"
name: coverage-stale-portable
description: Stale coverage must fail closed on GNU and BSD stat; a fresh report must still pass.
tags: [plan-coverage]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash run_cases.sh
  prompt: |
    Run the stale and fresh coverage cases with GNU and simulated BSD stat, and print each exit code.
context:
  scaffold_script: fixture.sh
