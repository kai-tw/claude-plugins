schema_version: "1.1"
name: rules-on-path
description: mother-tongue-rules, called by bare name from any working directory, prints the zh-TW rules.md; an unknown locale returns 1.
tags: [bin]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: cd "$(mktemp -d)" && mother-tongue-rules; echo "rules=$?"; mother-tongue-rules xx; echo "missing=$?"
  prompt: |
    In an empty directory, print the Chinese writing rules and the exit code, then do it again for the nonexistent locale xx.
context:
  scaffold_script: fixture.sh
