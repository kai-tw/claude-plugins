schema_version: "1.1"
name: banned-du-ping
description: The Stop hook blocks a reply that writes 讀屏 (Mainland term for "screen reader") and offers the Taiwanese term; 閱讀屏東 and a backtick-quoted mention do not count.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Feed stop.sh three zh-TW replies (one using 讀屏, one containing 閱讀屏東, one quoting it in backticks) and print the output.
context:
  scaffold_script: fixture.sh
