schema_version: "1.1"
name: rules-verb-shibai
description: The rules attached to a Chinese prompt require a failed action to be written 「verb + 失敗」, not 「沒有 + verb」.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Feed remind.sh one Chinese prompt and print the rules it attaches.
context:
  scaffold_script: fixture.sh
