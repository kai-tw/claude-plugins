schema_version: "1.1"
name: reply-language
description: When a reply in a Chinese conversation falls back to English, the Stop hook blocks it whole and asks for a Chinese rewrite; English inside a code block, an English conversation, and no recorded conversation locale are not blocked.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Set a conversation locale, feed stop.sh several replies, and print the output.
context:
  scaffold_script: fixture.sh
