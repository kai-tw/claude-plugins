schema_version: "1.1"
name: poll-gate
description: poll-gate blocks `gh pr checks --watch`, `gh run watch`, `watch` and loops that sleep (exit 2); one-shot queries, build watchers, loops without sleep, and mentions only inside a message or heredoc all pass.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Feed the poll-gate hook several polling commands and several healthy ones, and print the exit code of each.
context:
  scaffold_script: fixture.sh
