schema_version: "1.1"
name: search-gate
description: search-gate blocks a recursive search (find, fd, rg, grep -r, ls -R, the Grep and Glob tools) rooted at /, the home directory, /Users or /home (exit 2) — it walks every volume for minutes; a search under one directory, a depth of 2 or less, a non-recursive look, and mentions inside a quote, message or heredoc all pass.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Feed the search-gate hook several disk-wide and home-wide searches and several targeted ones, and print the exit code of each.
context:
  scaffold_script: fixture.sh
