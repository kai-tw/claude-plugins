schema_version: "1.1"
name: stale-check
description: When the running version lags the marketplace index, the Stop hook installs missing dependencies, updates the plugin in its install record's project, and blocks with top-level decision / reason saying so; a failed update gives the manual command instead. It speaks once per session and stays quiet when stop_hook_active is true or the versions match.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    In a fake install directory (running 0.1.0, index 0.2.0), feed the stale-check hook several Stop inputs and print the output.
context:
  scaffold_script: fixture.sh
