schema_version: "1.1"
name: stale-check
description: 執行中的版本落後 marketplace 索引時，Stop hook 以頂層 decision / reason 擋下並附上更新指令；同一 session 只說一次，stop_hook_active 為 true 或版本相同時不出聲。
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    在假的安裝目錄下（執行中 0.1.0、索引 0.2.0）對 stale-check hook 餵幾次 Stop 輸入，印出輸出。
context:
  scaffold_script: fixture.sh
