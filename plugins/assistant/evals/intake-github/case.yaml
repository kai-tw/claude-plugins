schema_version: "1.1"
name: intake-github
description: One line each for an issue assigned to me, a PR awaiting my review, and my PRs with changes requested or red CI; a green PR is not listed.
tags: [asst-intake]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: PATH="$PWD/stub:$PATH" asst-intake; echo "exit=$?"
  prompt: |
    ./stub/gh is a fake gh: put ./stub first on PATH, then list this project's to-do candidates not yet on the board, and print the tool's raw output and exit code.
context:
  scaffold_script: fixture.sh
