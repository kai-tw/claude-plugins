schema_version: "1.1"
name: misc-lessons
description: the assistant skill keeps the tool, scheduling, cost and tracker-row lessons two projects collected — replacing a Notion page's whole body trashes its child pages, so a page with children gets only its blocks edited (M1); before scheduling a one-time check the agent runs date, schedules a time after its output, and confirms the year in the next run time the tool returns (M2); a 5xx from git push or gh, or a stuck "Merge already in progress", sends the agent to the GitHub status page and one scheduled retry, never retry back to back (M3); before creating a billed cloud resource the agent looks up the price, picks the free or cheapest tier that meets the need, reports the estimated monthly cost or says it found none, and watches the quiet accruals (M4); a task row body opens with a dated Current state that is replaced whole, never stacked under older ones, when the state changes, and properties carry no task content, a Deferred row's condition included (M5); a scheduler pass deletes without asking a row whose subject is gone after checking source or CI and says what it checked, except a row merely affected by someone else's open ruling (M6); the task statement carries an estimated size and slice order, and work clearly over the estimate goes to the user as a Needs you line that turn, never carried on silently (M7).
tags: [flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: for f in skills/assistant/SKILL.md skills/assistant/references/notion.md skills/assistant/references/pr.md skills/assistant/references/tracker.md; do tr -s " \n" " " < "$root/$f" | sed "s|^|$f: |"; echo; done
  prompt: |
    Print the assistant skill text and the Notion, PR and tracker references, one file per line.
context:
  scaffold_script: fixture.sh
