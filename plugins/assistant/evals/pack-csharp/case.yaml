schema_version: "1.1"
name: pack-csharp
description: --paths picks language files by extension — .cs brings only csharp.md, not dart.md or js.md, with the charter first.
tags: [style-pack]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: style-pack --paths src/Spins/SpinEngine.cs
  prompt: |
    Print the style-code rules a review of src/Spins/SpinEngine.cs should cite.
context:
  scaffold_script: fixture.sh
