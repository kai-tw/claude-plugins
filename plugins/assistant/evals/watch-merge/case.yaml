schema_version: "1.1"
name: watch-merge
description: asst-watch exits on the first pushed event that closes a watched PR — merged or closed, ignoring other PRs and other actions — reports a PR already merged when it connects, fails loudly when the forwarder cannot start or the extension is missing, and leaves no forwarder running.
tags: [asst-watch]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; cp merge.jsonl events.jsonl; r=$(asst-watch wt); echo "merge=$r exit=$?"; cp closed.jsonl events.jsonl; r=$(asst-watch wt); echo "closed=$r exit=$?"; cp none.jsonl events.jsonl; r=$(GH_STATE=MERGED asst-watch wt); echo "already=$r exit=$?"; GH_HOOK_TAKEN=yes asst-watch wt; echo "taken=$?"; GH_NOWEBHOOK=yes asst-watch wt; echo "nowebhook=$?"; echo "left=$(pgrep -f "webhook forwar[d] --events" | wc -l | tr -d " ")"
  prompt: |
    With a fake gh whose webhook forwarder pushes a scripted list of pull_request events, run asst-watch on a task worktree in several situations and print what it reports and its exit codes.
context:
  scaffold_script: fixture.sh
