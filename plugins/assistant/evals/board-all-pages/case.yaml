schema_version: "1.1"
name: board-all-pages
description: asst-notion query follows next_cursor to the last page instead of stopping at the first; asst-board list returns only the live rows, list --all every row.
tags: [asst-board, asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" NTN_BIN="$PWD/stub/ntn"; asst-notion query tasklist --root 11111111111111111111111111111111 | jq -sc "{count: .[0].count, names: [.[1:][].Name]}"; echo "pages=$(grep -c "query" ntn.log)"; echo "live=$(asst-board list | grep -c " · ") statuses=$(asst-board list | grep " · " | awk -F " · " "{print \$2}" | sort -u | paste -sd, - | tr -d " ")"; echo "all=$(asst-board list --all | grep -c " · ")"; asst-board list --all
  prompt: |
    On a fake Notion (a task board split into three pages, five rows in all), read the whole task board with asst-notion query, then list it with asst-board list and list --all, and print the results.
context:
  scaffold_script: fixture.sh
