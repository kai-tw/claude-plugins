schema_version: "1.1"
name: cite-fabricated
description: A fact table citing a method that does not exist and a line past the end of the file: asst-cite must FAIL both; a real citation is ok.
tags: [asst-cite]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-cite . scout.md; echo "exit=$?"
  prompt: |
    scout.md is a Scout report. Check each `file:line` citation in its Facts table against the claim beside it, using a citation-check tool if one is available. Print each row's result and the final exit code.
context:
  scaffold_script: fixture.sh
