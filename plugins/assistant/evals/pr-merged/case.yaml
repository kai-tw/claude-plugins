schema_version: "1.1"
name: pr-merged
description: asst-pr merged looks once at the task PR and never waits — merged says close the task, closed says tell the user, and still open says the next step waits for the user (no scheduled look). The webhook watcher is gone.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; echo "7 OPEN " > pr.state; asst-pr merged x wt > o.out 2>&1; echo "open=$?"; sed "s/^/o: /" o.out; echo "7 MERGED abc1234def" > pr.state; asst-pr merged x wt > m.out 2>&1; echo "merged=$?"; sed "s/^/m: /" m.out; echo "7 CLOSED " > pr.state; asst-pr merged x wt > c.out 2>&1; echo "closed=$?"; sed "s/^/c: /" c.out; asst-pr watch x wt > /dev/null 2>&1; echo "watch=$?"; echo "watchers=$(ls "$root/skills/assistant/scripts" | grep -cE "^(pr-watch|hub)\.mjs$")"
  prompt: |
    Look once at whether the task's PR merged.
context:
  scaffold_script: fixture.sh
