schema_version: "1.1"
name: kb-modules
description: The KB has five modules (frontend, backend, product, marketing, design); the adapter's `kb_pages:` names the ones a project keeps, and nothing else, each loaded only at the steps its first line names. Every product mechanism a task adds or changes is a `Needs you` and never changes during the build; the `product` module writes it onto its page at ①, on Notion or in a repo directory, and the code follows the page.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f() { tr -s " \n" " " < "$root/$1"; }; c() { echo "$1=$(f $2 | grep -cF "$3")"; }; c brief-needs-you skills/assistant/references/brief.md "Every product mechanism the task adds or changes — what the user sees, or how a feature behaves — is \`Needs you\`"; c skill-no-change skills/assistant/SKILL.md "Build, wire and fix rounds never change a decided mechanism"; c skill-unlisted skills/assistant/SKILL.md "and never read a module"; c skill-load-at skills/assistant/SKILL.md "first line names the steps it is loaded at"; c skill-close skills/assistant/SKILL.md "Run each loaded module"; c module-load-at skills/assistant/references/kb/product.md "Load at: ① brief (step 3) · Close (step 8)"; c module-writes-page skills/assistant/references/kb/product.md "write each decided mechanism onto its page before Build starts"; c module-close skills/assistant/references/kb/product.md "line from the last section of each page ① wrote"; c no-refs skills/assistant/references/kb/product.md "no list of the lines read is kept anywhere"; c dir-mode skills/assistant/references/kb/product.md "so a page merges with the code that follows it"; c shared-optional skills/assistant/references/kb/product.md "A project with no shared designs leaves that part out"; c builder-follows agents/builder.md "the code follows the page"; c verifier-fix agents/verifier.md "Fix: change the code to match the page"; echo "adapter=$(grep -c "^kb_pages: " "$root/skills/assistant/references/project.md")"; c old-sibling skills/assistant/SKILL.md "against the sibling implementation"; c five-values skills/assistant/SKILL.md "five modules: \`frontend\` · \`backend\` · \`product\` · \`marketing\` · \`design\`"; c others-inert skills/assistant/SKILL.md "listing another one changes nothing"; c old-where skills/assistant/references/project.md "<module> = <where>"; c no-subpages skills/assistant/references/project.md "共用設計"
  prompt: |
    Say how the assistant decides which KB pages a project keeps, when it reads each module, who decides a product mechanism, and what happens when the code differs from the product page.
context:
  scaffold_script: fixture.sh
