schema_version: "1.1"
name: kb-modules
description: Each KB module is loaded only at the steps its first line names. Every product behaviour a task adds or changes is a `Needs you` and never changes during the build; the `product` module writes it onto its page at the decision brief, on Notion or in a repo directory, and the code follows the page.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f() { tr -s " \n" " " < "$root/$1"; }; c() { echo "$1=$(f $2 | grep -cF "$3")"; }; c brief-needs-you skills/assistant/references/brief.md "Every product behaviour the task adds or changes — what the user sees, or how a feature behaves — is \`Needs you\`"; c skill-no-change skills/assistant/SKILL.md "Build, integration and fix rounds never change a decided product behaviour"; c skill-load-at skills/assistant/SKILL.md "first line names the steps it is loaded at"; c skill-close skills/assistant/SKILL.md "Run each loaded module"; c module-load-at skills/assistant/references/kb/product.md "Load at: decision brief (step 3) · the user"; c module-writes-page skills/assistant/references/kb/product.md "write each decided behaviour onto its page before Build starts"; c module-task-view skills/assistant/references/kb/product.md "until it is trashed at Close"; c no-refs skills/assistant/references/kb/product.md "no list of the lines read is kept anywhere"; c shared-optional skills/assistant/references/kb/product.md "A project with no shared designs leaves that part out"; c builder-follows agents/builder.md "the code follows the page"; c verifier-fix agents/verifier.md "Fix: change the code to match the page"; c old-sibling skills/assistant/SKILL.md "against the sibling implementation"; c old-where skills/assistant/references/project.md "<module> = <where>"; c no-subpages skills/assistant/references/project.md "共用設計"
  prompt: |
    Say when the assistant reads each KB module, who decides a product mechanism, and what happens when the code differs from the product page.
context:
  scaffold_script: fixture.sh
