schema_version: "1.1"
name: charon
description: "[S4] charon blocks deleting commands (bare, sudo, xargs, find -exec) when the machine has trash and lets other commands through; where there is no trash it blocks trash instead; its messages carry no guardrails prefix."
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Feed the charon hook delete commands with and without a trash binary on PATH and print each exit code.
context:
  scaffold_script: fixture.sh
