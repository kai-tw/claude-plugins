schema_version: "1.1"
name: notion-spec-pages-writes-refused
description: asst-notion refuses update, set, append, check, trash and comment aimed at a spec page (a page in kb-pages), with and without --root, and sends nothing; a page under a plain page is still written, and a failed page lookup stops the write.
tags: [asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" NTN_BIN="$PWD/stub/ntn"; R=11111111111111111111111111111111; t() { n=$1; shift; w=$(grep -c "^write" ntn.log); "$@" <<< "x" > /dev/null 2> err.txt; e=$?; echo "$n: exit=$e writes=$(( $(grep -c "^write" ntn.log) - w )) msg=$(grep -c "spec pages are read-only" err.txt)"; }; for r in "--root $R" ""; do k=${r:+root}; k=${k:-bare}; t update-$k asst-notion update update1.json --commit $r; t set-$k asst-notion set tasklist p1 Name=x --commit $r; t append-$k asst-notion append p1 - --commit $r; t check-$k asst-notion check p1 x --commit $r; t trash-$k asst-notion trash p1 --commit $r; t comment-$k asst-notion comment p1 hello --commit $r; done; t plain-append asst-notion append p2 - --commit; t plain-comment asst-notion comment p2 hello --commit; t plain-update asst-notion update update2.json --commit --root $R; t error-append asst-notion append pe - --commit; t error-comment asst-notion comment pe hello --commit; t error-trash asst-notion trash pe --commit; t error-update asst-notion update updatee.json --commit --root $R
  prompt: |
    On a fake Notion, try each write command (update, set, append, check, trash, comment) with --commit on a spec page, with and without --root, and then on an ordinary page. Print each command's exit code and how many writes it sent.
context:
  scaffold_script: fixture.sh
