schema_version: "1.1"
name: intake-journal
description: With no GitHub remote it prints skip github; one line per open journal thread, template comments excluded.
tags: [asst-intake]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-intake; echo "exit=$?"
  prompt: |
    List this project's to-do candidates not yet on the board (GitHub and session journal), and print the tool's raw output and exit code.
context:
  scaffold_script: fixture.sh
