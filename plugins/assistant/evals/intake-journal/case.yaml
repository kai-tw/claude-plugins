schema_version: "1.1"
name: intake-journal
description: 沒有 GitHub remote 時印 skip github；journal 的每個未關 thread 各一行，模板註解不算。
tags: [asst-intake]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-intake; echo "exit=$?"
  prompt: |
    列出這個專案 board 以外的待辦候選（GitHub 與 session journal），印出工具的原始輸出和 exit code。
context:
  scaffold_script: fixture.sh
