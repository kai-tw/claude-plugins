schema_version: "1.1"
name: budget-cap-hit
description: 第 3 次 fix spend 撞 cap 2：印 CAP HIT、exit 1。
tags: [asst-budget]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: for i in 1 2 3; do asst-budget spend demo fix; done; echo "exit=$?"
  prompt: |
    對任務 demo 連續記 3 次 fix round（每輪都用預算工具記一次）。第 3 次應該被擋下；印出工具每次的輸出和最後一次的 exit code。
context:
  scaffold_script: fixture.sh
