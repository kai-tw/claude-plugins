schema_version: "1.1"
name: budget-cap-hit
description: The 3rd fix spend hits cap 2: prints CAP HIT, exit 1.
tags: [asst-budget]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: for i in 1 2 3; do asst-budget spend demo fix; done; echo "exit=$?"
  prompt: |
    Record 3 fix rounds in a row for task demo (one budget-tool record per round). The 3rd should be blocked; print the tool's output each time and the last exit code.
context:
  scaffold_script: fixture.sh
