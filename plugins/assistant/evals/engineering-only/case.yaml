schema_version: "1.1"
name: engineering-only
description: The assistant doesn't write product behaviour. references/kb/product.md is gone and nothing the plugin ships outside evals/ tells the assistant or an agent to create or edit a product spec page; SKILL.md says the spec pages are read-only and quoted. A case-table cell the spec doesn't decide, or a spec that conflicts with the code, becomes a `Needs you` line with a concrete example, settled with the PM, and the assistant never writes the rule. The decisions the assistant files are engineering decisions; a product behaviour changes only through the spec page.
tags: [spec, kb, assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash "${TMPDIR:-/tmp}/engineering-only-eval/check.sh" "$root"
  prompt: |
    Say whether the assistant ever creates or edits a product spec page, how it treats the spec pages it reads, what it does with a case-table cell the spec doesn't decide or a spec that conflicts with the code, and what kind of decisions it files and how a product behaviour changes.
context:
  scaffold_script: fixture.sh
