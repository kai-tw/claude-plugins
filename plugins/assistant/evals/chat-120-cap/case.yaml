schema_version: "1.1"
name: chat-120-cap
description: While a task is being worked on, every chat message the assistant writes is at most 120 characters; the decision brief, the screen review, the delivery summary and `Needs you` lines keep their own forms.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f() { tr -s " \n" " " < "$root/$1"; }; echo "skill-cap=$(f skills/assistant/SKILL.md | grep -cF "120 characters")"
  prompt: |
    Say how long a chat message may be while a task is being worked on.
context:
  scaffold_script: fixture.sh
