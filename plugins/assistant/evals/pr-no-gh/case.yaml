schema_version: "1.1"
name: pr-no-gh
description: 沒有可用的 gh（沒裝、沒登入、remote 不在 GitHub）時，asst-pr 以 exit 2 說出原因；open 仍會 push，ready 不會誤報成「沒開過 PR」。
tags: [asst-pr]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD"; PATH="$PWD/nogh" "$root/libexec/asst-pr" open y wt; echo "missing=$?"; echo "pushed=$(git -C wt rev-parse HEAD | cut -c1-7) $(git -C origin.git rev-parse task/y | cut -c1-7)"; PATH="$PWD/nogh" "$root/libexec/asst-pr" ready y wt; echo "ready_missing=$?"; GH_AUTH=no PATH="$PWD/stub:$PATH" "$root/libexec/asst-pr" ready y wt; echo "noauth=$?"; GH_REPO=no PATH="$PWD/stub:$PATH" "$root/libexec/asst-pr" open y wt; echo "norepo=$?"; echo "gh_calls=$(cat gh.log 2>/dev/null | wc -l | tr -d " ")"
  prompt: |
    分別在沒有 gh、gh 沒登入、remote 不在 GitHub 三種情況下跑 asst-pr open 與 ready，印出訊息與結束碼，並確認分支仍有 push。
context:
  scaffold_script: fixture.sh
