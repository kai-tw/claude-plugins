schema_version: "1.1"
name: pr-no-gh
description: Without a usable gh (not installed, not signed in, remote not on GitHub), asst-pr exits 2 stating the reason; open still pushes, and ready does not misreport it as "PR never opened".
tags: [asst-pr]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD"; PATH="$PWD/nogh" "$root/bin/asst-pr" open y wt; echo "missing=$?"; echo "pushed=$(git -C wt rev-parse HEAD | cut -c1-7) $(git -C origin.git rev-parse task/y | cut -c1-7)"; PATH="$PWD/nogh" "$root/bin/asst-pr" ready y wt; echo "ready_missing=$?"; GH_AUTH=no PATH="$PWD/stub:$PATH" "$root/bin/asst-pr" ready y wt; echo "noauth=$?"; GH_REPO=no PATH="$PWD/stub:$PATH" "$root/bin/asst-pr" open y wt; echo "norepo=$?"; echo "gh_calls=$(cat gh.log 2>/dev/null | wc -l | tr -d " ")"
  prompt: |
    Run asst-pr open and ready with no gh, with gh not signed in, and with the remote not on GitHub; print the messages and exit codes, and confirm the branch is still pushed.
context:
  scaffold_script: fixture.sh
