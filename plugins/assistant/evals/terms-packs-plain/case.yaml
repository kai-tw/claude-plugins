schema_version: "1.1"
name: terms-packs-plain
description: style-pack speaks plain rule wording — what its command prints, its --help, SKILL.md, CONVENTIONS.md and evidence.md name core / language / locale / project rules, and carry no legal metaphor (charter, statute, regulation, legislate, amend) and no coined term (consumption point, kind word, stand-in, undeterminable, transcription, the founder).
tags: [style-pack]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: style-pack dart csharp js; style-pack --help; cat "$root/skills/style-pack/SKILL.md" "$root/skills/style-pack/rules/CONVENTIONS.md" "$root/skills/style-pack/references/evidence.md"
  prompt: |
    Print every rule style-pack carries, its --help, its skill,
    its CONVENTIONS.md and the evidence rules.
context:
  scaffold_script: fixture.sh
