schema_version: "1.1"
name: printed-command-names
description: Usage, error and help text name the commands an agent can run (asst-section, asst-notion), never their old names.
tags: [asst-section, asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-section; asst-section get body.md "Problem"; asst-notion --help
  prompt: |
    Run `asst-section` with no arguments, then `asst-section get body.md "Problem"`, then `asst-notion --help`. Report which command names the output tells you to run.
context:
  scaffold_script: fixture.sh
