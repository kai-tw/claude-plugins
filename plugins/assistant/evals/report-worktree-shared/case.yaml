schema_version: "1.1"
name: report-worktree-shared
description: Reports an agent files inside a worktree are readable by the assistant in the main tree.
tags: [asst-report]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: (cd wt && echo finding | asst-report put t verify-code); asst-report latest t verify-code
  prompt: |
    Inside worktree wt, file a verify-code report for task t; back in the main tree, print the latest verify-code report path.
context:
  scaffold_script: fixture.sh
