schema_version: "1.1"
name: standing-corrections
description: The shipped skill and agents carry the user's standing corrections — a closed row is archived then trashed, the PR text is rewritten before ready and a merge is a pinned squash, screens are checked before the screen review, open questions never fall to Decided for lack of room, agents run only what finishes in their turn and file reports under their own names.
tags: [flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: for f in skills/assistant/SKILL.md skills/assistant/references/pr.md skills/assistant/references/screen-review.md skills/assistant/references/tracker.md skills/assistant/references/verify.md skills/assistant/references/brief.md agents/builder.md agents/verifier.md; do tr -s " \n" " " < "$root/$f" | sed "s|^|$f: |"; echo; done
  prompt: |
    Print the assistant skill, its PR, screen-review, tracker, verify and brief references and the builder and verifier, one file per line.
context:
  scaffold_script: fixture.sh
