schema_version: "1.1"
name: release-look
description: asst-pr release starts release.yml once and never waits — it prints the run and names the one look to schedule; release --run looks at that run once — still running names the next look, success is RELEASED, a failure before the default branch moved hands the user the push command, a failure after it moved reports the run link.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; sha=$(git -C wt rev-parse origin/staging); asst-pr release r1 wt > s.out 2>&1; echo "s=$?"; sed "s/^/s: /" s.out; ./state in_progress "" "$sha"; asst-pr release r1 wt --run 4242 > r.out 2>&1; echo "r=$?"; sed "s/^/r: /" r.out; ./state completed success "$sha"; asst-pr release r1 wt --run 4242 > a.out 2>&1; echo "a=$?"; sed "s/^/a: /" a.out; ./state completed failure "$sha"; asst-pr release r1 wt --run 4242 > b.out 2>&1; echo "b=$?"; sed "s/^/b: /" b.out; git -C wt push -q origin "$sha:refs/heads/main" 2>/dev/null; asst-pr release r1 wt --run 4242 > c.out 2>&1; echo "c=$?"; sed "s/^/c: /" c.out; echo "dispatches=$(grep -c "gh workflow run" gh.log)"
  prompt: |
    Release staging to production, then look at the release run.
context:
  scaffold_script: fixture.sh
