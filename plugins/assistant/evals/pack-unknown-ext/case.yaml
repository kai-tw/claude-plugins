schema_version: "1.1"
name: pack-unknown-ext
description: An unknown extension → exit 2, nothing printed.
tags: [style-pack]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: style-pack --paths lib/a.py; echo "exit=$?"
  prompt: |
    Print the style-code rules a review of lib/a.py should cite; print the exit code.
context:
  scaffold_script: fixture.sh
