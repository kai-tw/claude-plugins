schema_version: "1.1"
name: mutation-dispatch
description: 派 mutation runner 的規範寫明等法（plan-mutation --wait）與拒跑時回報、不改 pubspec.yaml——只禁 polling 不給等法，runner 會自己開 Monitor 與 tail -f。
tags: [cloud]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f="$root/skills/assistant/references/cloud-dispatch.md"; grep -c "plan-mutation --wait" "$f" | sed "s/^/wait=/"; grep -c "跑完而改 .pubspec.yaml." "$f" | sed "s/^/pubspec=/"
  prompt: |
    查 cloud-dispatch.md 派 mutation runner 的段落有沒有寫等法，以及拒跑時是否禁止改 pubspec.yaml。
context:
  scaffold_script: fixture.sh
