schema_version: "1.1"
name: deliver-after-ready
description: The delivery summary's header names the PR as ready.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: grep -o "PR #n ready" "$root/skills/assistant/references/delivery-summary.md" | sed "s/^/header: /"
  prompt: |
    Check that the delivery summary header names the PR as ready.
context:
  scaffold_script: fixture.sh
