schema_version: "1.1"
name: assistant-investigates
description: The assistant runs the investigation itself and files it with asst-report put <slug> investigation; agents/builder.md has no investigation phase and SKILL.md dispatches the builder only for ui, integration and fix. When a behaviour depends on several interleaving conditions the investigation lists every combination as a case table (base-branch behaviour with file:line, the spec's rule, the behaviour after the change) and the brief carries it (SKILL.md and references/brief.md). agents/tester.md writes at least one test per case-table cell; agents/verifier.md checks every fix round against the whole case table.
tags: [investigation, case-table, assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Say who runs the investigation and how it is filed, which phases the builder is dispatched for, what the investigation lists when a behaviour depends on several interleaving conditions and where the brief carries it, and what the tester and the verifier do with it.
context:
  scaffold_script: fixture.sh
