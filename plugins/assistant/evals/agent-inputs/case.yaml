schema_version: "1.1"
name: agent-inputs
description: The user's corrections and the project's checks reach every agent that writes — builder and tester open the user's feedback and user memories before their first write, in the verifier's sentence; a second correction of the same thing becomes a rules proposal; the tester updates tests built on a changed convention; the builder fixes every place with a finding's shape and every restatement of a changed ruling and greps the whole repo after a delete or rename; builder and tester run the project's checks themselves before committing; every dispatch names the exact check command; the delivery summary lists the `fixed (base branch)` line and the verifier does not call those fixes "no reason found".
tags: [flow, agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: for f in agents/builder.md agents/tester.md agents/verifier.md skills/assistant/SKILL.md skills/assistant/references/delivery-summary.md skills/assistant/forms/build.md; do tr -s " \n" " " < "$root/$f" | sed "s|^|$f: |"; echo; done; echo "a1-shared-sentence=$(for f in builder tester verifier; do tr -s " \n" " " < "$root/agents/$f.md"; echo; done | grep -cE "from the MEMORY\.md index in your context, open each .feedback. or .user. memory that bears on (your files and follow it, never citing|the diff, and file each departure as a finding citing only its file name and the line that applies here, never) another project.s content\.")"
  prompt: |
    Print the builder, tester, verifier, assistant skill, delivery summary and build form text, one file per line, then how many agents share the memory sentence.
context:
  scaffold_script: fixture.sh
