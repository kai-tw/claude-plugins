schema_version: "1.1"
name: product-pages
description: Every product mechanism a task adds or changes is a `Needs you`; the decided mechanism goes onto its product page before Build, the code follows the page through build, wire and fix, and Close deletes the task's not-yet-built line; pages carry no code locations.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f() { tr -s " \n" " " < "$root/$1"; }; echo "brief-needs-you=$(f skills/assistant/references/brief.md | grep -cF "Every product mechanism the task adds or changes — what the user sees, or how a feature behaves — is \`Needs you\`")"; echo "skill-writes-page=$(f skills/assistant/SKILL.md | grep -cF "write each decided mechanism onto its product page before Build starts")"; echo "skill-no-change=$(f skills/assistant/SKILL.md | grep -cF "Build, wire and fix rounds never change a decided mechanism")"; echo "skill-close=$(f skills/assistant/SKILL.md | grep -cF "line from the last section of each product page step 3 wrote")"; echo "builder-follows=$(f agents/builder.md | grep -cF "the code follows the page")"; echo "verifier-fix=$(f agents/verifier.md | grep -cF "Fix: change the code to match the page")"; echo "adapter=$(grep -c "^product: " "$root/skills/assistant/references/project.md")"; echo "no-refs=$(f skills/assistant/references/product-pages.md | grep -cF "no list of the lines read is kept anywhere")"; echo "old-sibling=$(f skills/assistant/SKILL.md | grep -cF "against the sibling implementation")"
  prompt: |
    Say who decides a product mechanism, when it is written onto the product page, and what happens when the code differs from the page.
context:
  scaffold_script: fixture.sh
