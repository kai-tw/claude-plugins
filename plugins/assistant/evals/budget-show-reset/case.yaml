schema_version: "1.1"
name: budget-show-reset
description: fix counted to 2/2, other kinds untouched; after reset every kind is back to zero.
tags: [asst-budget]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-budget spend demo fix >/dev/null; asst-budget spend demo fix >/dev/null; asst-budget show demo; asst-budget reset demo; asst-budget show demo
  prompt: |
    Record 2 fix rounds for task demo and print the counts of all three kinds; then reset the task and print them again.
context:
  scaffold_script: fixture.sh
