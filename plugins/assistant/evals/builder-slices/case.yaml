schema_version: "1.1"
name: builder-slices
description: wire and fix are cut into slices, one builder and one checkpoint each; ui stays one dispatch; the next brief carries only what the code can't show; a builder that continues earlier work starts from git.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: sed -n "/^- Cut /,/dead end/p" "$root/skills/assistant/SKILL.md" | tr -s " \n" " " | sed "s/^/slices=/"; sed -n "/^and from .ui. on/,/git status/p" "$root/agents/builder.md" | tr -s " \n" " " | sed "s/^/builder=/"
  prompt: |
    Say how the assistant dispatches wire and fix work to builders, what it puts in the next brief, and where a builder that continues earlier work starts.
context:
  scaffold_script: fixture.sh
