schema_version: "1.1"
name: builder-slices
description: integration and fix are cut into slices, one builder and one commit each; ui stays one dispatch; the next brief carries only what the code can't show; a builder that continues earlier work starts from git.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: tr -s " \n" " " < "$root/skills/assistant/SKILL.md" | grep -o "Cut \`integration\` and \`fix\` into slices.*a dead end the last run hit" | sed "s/^/slices=/"; tr -s " \n" " " < "$root/agents/builder.md" | grep -o "and from \`ui\` on the approved decision brief.*\`git status\`" | sed "s/^/builder=/"
  prompt: |
    Say how the assistant dispatches wire and fix work to builders, what it puts in the next brief, and where a builder that continues earlier work starts.
context:
  scaffold_script: fixture.sh
