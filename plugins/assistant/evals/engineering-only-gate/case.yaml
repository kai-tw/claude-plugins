schema_version: "1.1"
name: engineering-only-gate
description: Nothing the plugin ships outside evals/ names ui-text-pack, asst-strings, verify-text, house-style, asst-analytics, analytics.md or analytics.mjs, and none of those files exists. The verifier marks each finding as opening a fix round or not (user-visible, data, security, spec behaviour or untested behaviour opens one; code style, test tidiness and wording do not); SKILL.md and references/verify.md open a round only for those, set no cap on fix rounds (when another round will not settle what is left, the remaining `fix` findings become one `Needs you` line), and send the verifier only the fix commit's diff plus the whole case table; the delivery summary lists the findings that did not open a round.
tags: [assistant, verifier, flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Say whether anything the plugin ships still names the text pack, the strings log, the text review, the house style or analytics, and quote how the verifier marks a finding as opening a fix round, when the assistant opens one, whether it caps fix rounds, what happens to the findings another round will not settle, and what the verifier gets back, and where findings that opened no round are listed.
context:
  scaffold_script: fixture.sh
