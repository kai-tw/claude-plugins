schema_version: "1.1"
name: engineering-only-gate
description: Nothing the plugin ships outside evals/ names ui-text-pack, asst-strings, verify-text, house-style, asst-analytics, analytics.md or analytics.mjs, and none of those files exists. The verifier marks each finding as opening a fix round or not (user-visible, data, security, spec behaviour or untested behaviour opens one; code style, test tidiness and wording do not); SKILL.md and references/verify.md open a round only for those, set no cap on fix rounds (when a `fix` finding comes back after the round meant to fix it, the advisor is dispatched once for it, and if the round on its advice still leaves findings they become one `Needs you` line), and send the verifier only the fix commit's diff plus the whole case table in a fix round; the delivery summary lists the findings that did not open a round.
tags: [assistant, verifier, flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Say whether anything the plugin ships still names the text pack, the strings log, the text review, the house style or analytics, and quote how the verifier marks a finding as opening a fix round, when the assistant opens one, whether it caps fix rounds, when the advisor is dispatched and what happens to the findings the round on its advice still leaves, and what the verifier gets back, and where findings that opened no round are listed.
context:
  scaffold_script: fixture.sh
