schema_version: "1.1"
name: node-fallback
description: A launcher that runs a .mjs script finds node where nvm installed it when PATH has none, instead of failing with "node not found".
tags: [launchers]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Bash]
  env:
    EVAL_CMD: PATH="$PWD/tools" HOME="$PWD/home" "$root/bin/asst-screens" probe 2>&1; echo "asst-screens=$?"
  prompt: |
    With no node on PATH but one installed under ~/.nvm, run asst-screens; print what it prints and its exit code.
context:
  scaffold_script: fixture.sh
