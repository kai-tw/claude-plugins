schema_version: "1.1"
name: report-post
description: A filed verify-* report is posted to the task's PR by the assistant with its GitHub tool — in full on a private repo, only its first line on any other; asst-report itself files it and calls no GitHub tool.
tags: [asst-report]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; echo finding-A | asst-report put r verify-code --worktree wt >/dev/null; echo "filed=$(ls wt/.claude/.assistant/reports/r | paste -sd, -)"; echo "gh-calls=$(cat gh.log 2>/dev/null | wc -l | tr -d " ")"; s=$(tr -s "[:space:]" " " < "$root/skills/assistant/SKILL.md"); echo "post=$(grep -ciE "verify-\*. report to the task.s PR" <<<"$s")"; echo "split=$(grep -ciE "PR, in full on a private repo [^.]*else its first line" <<<"$s")"
  prompt: |
    File a verify-code report with asst-report on a task branch where gh only logs its calls; say whether asst-report called gh, and what SKILL.md says the assistant does with a filed verify report.
context:
  scaffold_script: fixture.sh
