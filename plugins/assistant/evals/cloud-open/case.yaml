schema_version: "1.1"
name: cloud-open
description: asst-cloud lists its profiles (default opus/high, mutation-runner sonnet/medium), opens a cloud session through claude --cloud with the profile's model, effort and preamble (the runner's includes a 50-minute ScheduleWakeup rule), lets a flag override the profile, titles the session `PR# <n> <PR title>` for the branch's PR, else `<repo> · <branch>`, unless --name is given, prints the session id, a clean URL, the title and the environment it got, picks the environment by --env or a profile's `environment:` (a name looked up in the list saved from the last open, which `asst-cloud envs` prints), and refuses an unpushed HEAD, a check interval over 60 minutes, a failed open, an unknown environment name and a session claude opened in another environment (or did not say which) with exit 1, listing the environments claude saw so the right one can be picked.
tags: [cloud]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export ARGS="$PWD/args.txt" XDG_CACHE_HOME="$PWD/cache"; PATH="$PWD/fake:$PATH"; (cd solo && asst-cloud envs; echo "rc=$?") 2>&1 | sed "s/^/envs-none: /"; (cd solo && asst-cloud open --env Flutter "x"; echo "rc=$?") 2>&1 | sed "s/^/env-nolist: /"; (cd solo && asst-cloud profiles) 2>&1 | sed "s/^/profiles: /"; (cd solo && asst-cloud open "Do the thing"; echo "rc=$?") 2>&1 | sed "s/^/default: /"; echo "default-args: $(tr "\n" "|" < args.txt)"; (cd solo && asst-cloud open --profile mutation-runner "Run it"; echo "rc=$?") 2>&1 | sed "s/^/runner: /"; echo "runner-args: $(tr "\n" "|" < args.txt)"; (cd solo && asst-cloud open --profile mutation-runner --effort high "x"; echo "rc=$?") 2>&1 | sed "s/^/override: /"; : > args.txt; (cd ahead && asst-cloud open "x"; echo "rc=$?") 2>&1 | sed "s/^/ahead: /"; [ -s args.txt ] && echo "ahead-claude-ran"; (cd solo && asst-cloud open --check-every 90 "x"; echo "rc=$?") 2>&1 | sed "s/^/cap: /"; (cd solo && FAKE_FAIL=1 asst-cloud open "x"; echo "rc=$?") 2>&1 | sed "s/^/fail: /"; (cd solo && FAKE_PR="42 Fix the login" asst-cloud open "x"; echo "rc=$?") 2>&1 | sed "s/^/pr: /"; echo "pr-args: $(tr "\n" "|" < args.txt)"; (cd solo && FAKE_PR="42 Fix the login" asst-cloud open --name "Nightly mutation" "x") 2>&1 | sed "s/^/named: /"; (cd solo && asst-cloud envs) 2>&1 | sed "s/^/envs: /"; (cd solo && asst-cloud open --env flutter "x"; echo "rc=$?") 2>&1 | sed "s/^/env: /"; echo "env-args: $(tr "\n" "|" < args.txt)"; (cd solo && asst-cloud open --profile flutter --dry-run "x") 2>&1 | sed "s/^/env-profile: /"; : > args.txt; (cd solo && asst-cloud open --env Nope "x"; echo "rc=$?") 2>&1 | sed "s/^/env-unknown: /"; [ -s args.txt ] && echo "env-unknown-claude-ran"; (cd solo && asst-cloud open --env env_01Gone "x"; echo "rc=$?") 2>&1 | sed "s/^/env-fallback: /"; (cd solo && FAKE_NOPICK=1 asst-cloud open --env Flutter "x"; echo "rc=$?") 2>&1 | sed "s/^/env-unlogged: /"
  prompt: |
    List asst-cloud's environments before any open, then its profiles, open cloud sessions with the default and the mutation-runner profile and with an effort override, then try an unpushed repo, a 90-minute check interval and a failing claude, then open one on a branch with a PR and one with an explicit name; list the environments again, open one in Flutter by name and one through a profile's environment (dry run), then try an unknown environment name an environment id claude falls back from and a log that does not name the pick; print every output, exit code and the arguments claude received.
context:
  scaffold_script: fixture.sh
