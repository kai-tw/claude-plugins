schema_version: "1.1"
name: agent-roster
description: Three agents do the work — builder (ui through fix), tester (tests from the brief) and verifier (code reviews, self-scored) — and nothing in the assistant dispatches the retired roles or spawns an agent per finding.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: echo "agents=$(cd "$root/agents" && ls | sed "s|\.md$||" | paste -sd " " -)"; grep -lE "^  - Agent$" "$root"/agents/*.md | sed "s/^/spawns=/"; grep -rnoE "\`(scribe|code-verifier|text-verifier)\`|general-purpose" "$root/agents" "$root/skills/assistant" | sed "s/^/stale=/"
  prompt: |
    List assistant's agents, any agent that may spawn further agents, and any mention of an agent the assistant no longer has.
context:
  scaffold_script: fixture.sh
