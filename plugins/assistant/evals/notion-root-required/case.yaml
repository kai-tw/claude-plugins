schema_version: "1.1"
name: notion-root-required
description: No --root → refuses to write, guesses no default root, never calls ntn.
tags: [asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-notion set tasklist 12345678123456781234567812345678 Stage=Review; echo "exit=$?"
  prompt: |
    Set the Stage of tasklist page 12345678123456781234567812345678 to Review (dry-run is fine). This project declares no notion_root; do not guess one. Print the tool's output and exit code.
context:
  scaffold_script: fixture.sh
