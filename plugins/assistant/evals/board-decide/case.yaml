schema_version: "1.1"
name: board-decide
description: decide on Notion files one Decision Log row per fork, its Pages the **Pages** titles and its Task a relation to the task's TaskList row; archive is gone; a task row's Pages are sent as a list of titles.
tags: [asst-board]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-board archive t1 archive.md --dry-run; echo "archive-exit=$?"; asst-board decide t1 decisions.md --dry-run; asst-board create t3 Name=Fix "Pages=Read aloud,Human voice" --dry-run
  prompt: |
    The project config says the board is in Notion. Try archiving t1, dry-run filing decisions.md as t1's decisions, then dry-run creating task t3 (Fix) on the Read aloud and Human voice pages, and show what would be written.
context:
  scaffold_script: fixture.sh
