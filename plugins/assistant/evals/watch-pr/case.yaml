schema_version: "1.1"
name: watch-pr
description: asst-watch exits on the first pushed event that finishes a watched PR's CI (passed or failed) or closes it (merged or closed), ignoring other PRs, branches and actions; reports a PR already merged, or CI running at the start and done by the time it connects; fails loudly when the forwarder cannot start or the extension is missing, and leaves no forwarder running.
tags: [asst-watch]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; cp merge.jsonl events.jsonl; r=$(asst-watch wt); echo "merge=$r exit=$?"; cp closed.jsonl events.jsonl; r=$(asst-watch wt); echo "closed=$r exit=$?"; cp none.jsonl events.jsonl; r=$(GH_STATE=MERGED asst-watch wt); echo "already=$r exit=$?"; GH_HOOK_TAKEN=yes asst-watch wt; echo "taken=$?"; GH_NOWEBHOOK=yes asst-watch wt; echo "nowebhook=$?"; cp suite.jsonl events.jsonl; echo pending > checks; echo passed > checks.after; r=$(asst-watch wt); echo "cipass=$r exit=$?"; echo pending > checks; echo failed > checks.after; r=$(asst-watch wt); echo "cifail=$r exit=$?"; cp none.jsonl events.jsonl; echo pending > checks; echo passed > checks.after; r=$(GH_EARLY=yes asst-watch wt); echo "ciearly=$r exit=$?"; echo "left=$(pgrep -f "webhook forwar[d] --events" | wc -l | tr -d " ")"
  prompt: |
    With a fake gh whose webhook forwarder pushes a scripted list of pull_request and check_suite events, run asst-watch on a task worktree in several situations and print what it reports and its exit codes.
context:
  scaffold_script: fixture.sh
