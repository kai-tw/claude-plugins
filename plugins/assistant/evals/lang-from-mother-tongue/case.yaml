schema_version: "1.1"
name: lang-from-mother-tongue
description: The Chinese rules exist in one version only, mother-tongue's — assistant depends on it, agents read it by running mother-tongue-rules, and assistant carries no copy of its own.
tags: [lang]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: jq -r ".dependencies[].name" "$root/.claude-plugin/plugin.json"; grep -L mother-tongue-rules "$root"/agents/*.md | sed "s/^/unread=/"; ls "$root/bin/asst-lang" "$root/skills/assistant/references/language.md" 2>/dev/null || echo own=gone
  prompt: |
    List assistant's dependencies, the agents that do not call mother-tongue-rules, and whether assistant's own copy of the Chinese rules still exists.
context:
  scaffold_script: fixture.sh
