schema_version: "1.1"
name: board-show
description: asst-board show fetches one row's full properties (empty values omitted), and --body appends the body after ---; on Notion it fetches only that page, never querying the whole database; a file task board works the same.
tags: [asst-board, asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" NTN_BIN="$PWD/stub/ntn"; (cd notion && asst-board show 99999999999999999999999999999999 --body); echo "queries=$(grep -c "datasources query" ntn.log)"; (cd file && asst-board show t1 --body; asst-board show t1 | wc -l | tr -d " " | sed "s/^/file_lines=/")
  prompt: |
    Use asst-board show to read a single row on a Notion task board and on a file task board, appending the body with --body, and print the results.
context:
  scaffold_script: fixture.sh
