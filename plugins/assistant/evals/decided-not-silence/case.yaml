schema_version: "1.1"
name: decided-not-silence
description: A `Decided` line is the assistant's own call — the founder's silence never makes it their decision and the assistant never cites it as approval; a user-visible `Decided` that differs from how an existing mechanism already behaves is a `Needs you` with the current behaviour quoted, and brief-review files one that isn't.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f() { tr -s " \n" " " < "$root/$1"; }; echo "skill-own-call=$(f skills/assistant/SKILL.md | grep -cF "never makes one their decision")"; echo "skill-silence-accepts=$(f skills/assistant/SKILL.md | grep -cF "Silence on \`Decided\` = accepted")"; echo "skill-sibling=$(f skills/assistant/SKILL.md | grep -cF "check each user-visible \`Decided\` line against the sibling implementation")"; echo "brief-own-call=$(f skills/assistant/references/brief.md | grep -cF "silence never makes it theirs")"; echo "brief-silence-accepts=$(f skills/assistant/references/brief.md | grep -cF "silence accepts")"; echo "review-moves=$(f agents/verifier.md | grep -cF "is filed with Fix: move it to \`Needs you\`")"
  prompt: |
    Say what the founder's silence on a `Decided` line means, and where a ruling that changes how an existing mechanism behaves belongs.
context:
  scaffold_script: fixture.sh
