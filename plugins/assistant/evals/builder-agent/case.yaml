schema_version: "1.1"
name: builder-agent
description: A task's builder is the builder sub-agent, one phase per dispatch, with its instructions in the agent file; no linked builder session and no builder skill.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: test -e "$root/skills/builder" || echo builder-skill=none; grep -cE "start_session|Builder sessions|assistant:builder" "$root/skills/assistant/SKILL.md" | sed "s/^/session-refs=/"; grep -c "^- \*\*" "$root/agents/builder.md" | sed "s/^/agent-phases=/"
  prompt: |
    Say how the assistant runs a task's builder and where the builder's instructions live.
context:
  scaffold_script: fixture.sh
