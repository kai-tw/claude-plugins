schema_version: "1.1"
name: mutation-job
description: asst-mutation-job claims one queued file, runs the adapter's plan-mutation on it alone at the default branch's tip, comments a pass on every PR queued for it, opens one issue for a failing score or a run that scored nothing, prints what to post when gh is unusable, drops a file main no longer has, and exits 3 once the queue is empty.
tags: [asst-mutation-job]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; tip=$(cat tip.sha); cd wt; for m in pass blocked abort gone; do echo $m > ../stub.mode; [ $m = abort ] && export GH_OFF=1; asst-mutation-job; echo "$m=$?"; done; asst-mutation-job; echo "empty=$?"; echo "at-tip=$(grep -c "@ $tip$" ../pm.log)"; asst-mutation-queue status; cat ../pm.log ../gh.log
  prompt: |
    In a clone whose mutation queue holds four files, with a fake plan-mutation and gh, run asst-mutation-job until the queue is empty — a pass, a failing score, an abort with gh unusable, a file main no longer has — and print the output, exit codes, what was posted and the queue's status.
context:
  scaffold_script: fixture.sh
