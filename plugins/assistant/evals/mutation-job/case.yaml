schema_version: "1.1"
name: mutation-job
description: asst-mutation-job resumes a swept file at its pinned commit with its saved journal, pins a new claim to the tip, runs the adapter's worktree_init and then plan-mutation on the claimed file alone in the fixed worktree, reports a failed worktree_init as an error without mutating, saves the journal as it runs, comments a pass on every PR queued for the file, opens one issue for a failing score or a run that scored nothing, prints what to post when gh is unusable, drops a file the commit doesn't have, and exits 3 once the queue is empty.
tags: [asst-mutation-job]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH" ASST_MUTATION_SRC="$PWD/src" ASST_MUTATION_BEAT=1; tips() { sed "s/$(cat $EVAL_WS/tip1.sha)/TIP1/g;s/$(cat $EVAL_WS/tip2.sha)/TIP2/g;s#$EVAL_WS#WS#g"; }; cd wt; for m in pass slow abort initfail gone; do echo $m > ../stub.mode; [ $m = abort ] && export GH_OFF=1; [ $m = initfail ] && touch ../init.fail; asst-mutation-job; echo "$m=$?"; done; asst-mutation-job; echo "empty=$?"; asst-mutation-queue status; cat ../pm.log ../gh.log | tips
  prompt: |
    In a clone whose mutation queue holds five files — one of them resuming from a lost session — with a fake plan-mutation and gh, run asst-mutation-job until the queue is empty, and print the output, exit codes, how each run started, what was posted and the queue's status.
context:
  scaffold_script: fixture.sh
