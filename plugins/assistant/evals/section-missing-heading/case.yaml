schema_version: "1.1"
name: section-missing-heading
description: A heading that does not exist → exit 1, listing the headings present.
tags: [asst-section]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-section get body.md "Problem"; echo "exit=$?"
  prompt: |
    Print the `## Problem` section of body.md. If it does not exist, say so and list which `## ` sections the file actually has; print the tool's exit code.
context:
  scaffold_script: fixture.sh
