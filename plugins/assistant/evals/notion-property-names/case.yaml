schema_version: "1.1"
name: notion-property-names
description: .claude/kb-databases.txt maps a registry property to the project's own Notion property name (`decision-log.Pages = 相關頁面`); an unknown property in it fails and lists the valid ones.
tags: [asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-notion schema decision-log; cp bad.txt .claude/kb-databases.txt; asst-notion schema decision-log; echo "bad-exit=$?"
  prompt: |
    This project names its Decision Log properties in Chinese. Show the decision-log schema asst-notion uses, then try it with bad.txt as the mapping file.
context:
  scaffold_script: fixture.sh
