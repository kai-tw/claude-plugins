schema_version: "1.1"
name: lang-on-path
description: asst-lang 以裸名在任何工作目錄印出 language.md，agent 不必知道安裝路徑。
tags: [asst-lang]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: cd "$(mktemp -d)" && asst-lang; echo "lang=$?"
  prompt: |
    在一個空目錄裡印出 assistant 的中文寫作規則，並印出 exit code。
context:
  scaffold_script: fixture.sh
