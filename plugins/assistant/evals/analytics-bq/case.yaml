schema_version: "1.1"
name: analytics-bq
description: asst-analytics takes the GCP project as --project and stops with exit 2 and a clear message without it; it finds that project's analytics_<property> dataset and reads its events_* tables through bq, every query capped in bytes billed; params takes only an event name; sql fills in {events}; no dataset yet says how to link the export.
tags: [asst-analytics]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export PATH=$PWD:$PATH; asst-analytics events 2>&1; echo "noproj=$?"; asst-analytics events --project demo-project --days 2>&1; echo "nodays=$?";asst-analytics events --project demo-project --days 90; asst-analytics params book_open --project demo-project; asst-analytics params "x;DROP" --project demo-project; echo "bad=$?"; asst-analytics sql "SELECT COUNT(*) AS n FROM {events}" --project demo-project; touch nodataset; asst-analytics events --project demo-project 2>&1; echo "nods=$?"; echo "--- log"; cat bq.log
  prompt: |
    ./bq stands in for the BigQuery CLI (export PATH=$PWD:$PATH). With asst-analytics, try listing events without naming a GCP project, then with --project demo-project and --days given no value, then with --project demo-project list the events of the last 90 days, the parameters of book_open, try the parameters of "x;DROP", run a count over {events}, then try again once the dataset is gone (touch nodataset). Print bq.log.
context:
  scaffold_script: fixture.sh
