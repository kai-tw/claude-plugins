schema_version: "1.1"
name: notion-query-all-pages
description: asst-notion query follows next_cursor to the last page instead of stopping at the first.
tags: [asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" NTN_BIN="$PWD/stub/ntn"; asst-notion query tasklist --root 11111111111111111111111111111111 | jq -sc "{count: .[0].count, names: [.[1:][].Name]}"; echo "pages=$(grep -c "query" ntn.log)"
  prompt: |
    On a fake Notion (a TaskList split into three pages, five rows in all), read the whole TaskList with asst-notion query and print the result.
context:
  scaffold_script: fixture.sh
