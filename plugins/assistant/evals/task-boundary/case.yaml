schema_version: "1.1"
name: task-boundary
description: A task fixes base-branch defects inside its boundary without widening it, and changes code outside it only where its own diff changed the behaviour there; behaviour the base branch already has outside goes to a Backlog row, never a ruling. The builder marks such open questions and the verifier files such hunks.
tags: [flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: for f in agents/builder.md agents/verifier.md skills/assistant/SKILL.md skills/assistant/references/verify.md; do tr -s " \n" " " < "$root/$f" | sed "s|^|$f: |"; echo; done
  prompt: |
    Print the builder, verifier, assistant skill and verify reference text, one file per line.
context:
  scaffold_script: fixture.sh
