schema_version: "1.1"
name: task-boundary
description: A task changes code outside its boundary only where its own diff changed the behaviour there; behaviour the base branch already has goes to a Backlog row, never a ruling — the build marks such forks and the verifier files such hunks.
tags: [flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: for f in skills/assistant/references/build.md agents/verifier.md skills/assistant/SKILL.md; do tr -s " \n" " " < "$root/$f" | sed "s|^|$f: |"; echo; done
  prompt: |
    Print the build reference, verifier and assistant skill text, one file per line.
context:
  scaffold_script: fixture.sh
