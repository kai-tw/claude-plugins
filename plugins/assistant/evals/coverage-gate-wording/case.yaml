schema_version: "1.1"
name: coverage-gate-wording
description: The assistant states the coverage gate the way plan-coverage does — every changed line executed, no markers — not "no exemptions", since plan-coverage leaves drift table definitions unmeasured.
tags: [verify]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: grep -rhoE "every changed line executed, no[[:space:]]+[a-z]+" "$root/skills" | tr -s " \n" " "; echo
  prompt: |
    Print how the assistant skill describes the coverage gate.
context:
  scaffold_script: fixture.sh
