schema_version: "1.1"
name: board-no-adapter
description: 沒有 adapter → exit 2、指名該寫 adapter，不猜後端。
tags: [asst-board]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-board list; echo "exit=$?"
  prompt: |
    列出這個專案的 board。專案還沒有 .claude/assistant.md。印出工具輸出與 exit code。
context:
  scaffold_script: fixture.sh
