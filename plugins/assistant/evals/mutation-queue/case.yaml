schema_version: "1.1"
name: mutation-queue
description: asst-mutation-queue merges PRs that change the same file into one job, never hands out the same file twice or runs it twice at once, resumes a swept file at its pinned commit with its saved journal, starts a file over when newer PRs queued it meanwhile, gives up on a file that made no progress over three claims, and keeps both of two concurrent adds.
tags: [asst-mutation-queue]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Bash]
  env:
    EVAL_CMD: W=$PWD; q() { (cd "$1" && shift && asst-mutation-queue "$@"); }; tip1=$(git -C a rev-parse HEAD); tips() { sed "s/$tip1/TIP1/;s/${tip2:-none}/TIP2/"; }; q a add 7 lib/a.dart lib/b.dart; q b add 9 lib/a.dart; echo "claim1=$(q a claim | tips)"; echo "claim2=$(q b claim | tips)"; q b claim; echo "empty=$?"; q a add 11 lib/a.dart; q a claim; echo "busy=$?"; printf "h\nm1\n" > j; q b save lib/b.dart "$W/j"; git -C a -c user.name=e -c user.email=e@e commit -q --allow-empty -m next; git -C a push -q origin HEAD:main; tip2=$(git -C a rev-parse HEAD); sleep 1; q a sweep 0; for n in 1 2; do c=$(q b claim "$W/r$n"); echo "claimed: $c" | tips; echo "journal: ${c%% *} $([ -e r$n ] && grep -c . r$n || echo none)"; done; q a done lib/a.dart; q a done lib/b.dart; q a add 12 lib/c.dart; for i in 1 2 3; do q a claim >/dev/null; sleep 1; q a sweep 0; done; q a add 20 lib/x.dart & q b add 21 lib/y.dart & wait; q a status | sed "s/^/status: /"
  prompt: |
    From two clones of one remote, add files to the mutation queue and claim them, save a journal, move main on, sweep, claim again, let one file stall three times, add from both clones at once, and print the queue's status.
context:
  scaffold_script: fixture.sh
