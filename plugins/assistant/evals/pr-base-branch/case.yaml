schema_version: "1.1"
name: pr-base-branch
description: With base_branch set in the adapter, asst-pr open creates the draft PR into that branch, ready refuses a PR that targets the default branch instead; release --dry-run lists what staging carries and starts nothing, and release starts release.yml on the default branch pinned to staging's head commit; on an svn project, release says base_branch and releases are git only.
tags: [asst-pr]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: export EVAL_WS="$PWD" PATH="$PWD/stub:$PATH"; GH_HAS_PR=0 asst-pr open x wt --title t --body b >/dev/null 2>&1; echo "open=$?"; grep "^gh pr create" gh.log; : > gh.log; GH_BASE=main asst-pr ready x wt 2>&1; echo "ready-main=$?"; asst-pr release r1 wt --dry-run 2>&1; echo "dry=$?"; echo "dry-runs=$(grep -c "workflow run" gh.log)"; asst-pr release r1 wt 2>&1; echo "release=$?"; grep "workflow run" gh.log; grep -q "sha=$(git -C wt rev-parse origin/staging)$" gh.log && echo pinned; asst-pr release r1 svnproj 2>&1; echo "svn=$?"
  prompt: |
    With a fake gh and an adapter whose base_branch is staging, run asst-pr open on a task branch, asst-pr ready on a PR that targets main, then asst-pr release with --dry-run and without, and asst-pr release on an svn project. Print every output, exit code and gh call.
context:
  scaffold_script: fixture.sh
