schema_version: "1.1"
name: worktree-disk-fallback
description: Before a task's worktree is created SKILL.md has the assistant measure free space with df on the disk that holds the worktrees; under 30 GB it makes no worktree and runs the task on a branch in the main checkout (git switch -c from the default branch, uncommitted changes carried over, unstaged by agents), starts no other task until it closes, and references/tracker.md's Close switches back and deletes the branches; a CLAUDE.md that forbids such branches gets a Needs you line.
tags: [assistant, flow]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: 'n() { tr -s " \n" " " < "$root/skills/assistant/$1"; }; echo "skill-df=$(n SKILL.md | grep -c "Before creating a task.s worktree, measure the free space with \`df\` on the disk that holds the worktrees; under 30 GB free, create no worktree")"; echo "skill-branch=$(n SKILL.md | grep -cF "run that task on a branch in the main checkout (\`git switch -c <branch>\` from the default branch, carrying any uncommitted changes over as they are)")"; echo "skill-remeasure=$(n SKILL.md | grep -cF "Every new task measures again.")"; echo "skill-queue=$(n SKILL.md | grep -cF "start no other task until it closes")"; echo "skill-unstaged=$(n SKILL.md | grep -cF "Agents commit only files they changed themselves; the carried-over files, named in every dispatch, stay unstaged.")"; echo "skill-add-fails=$(n SKILL.md | grep -cF "Otherwise a failed \`git worktree add\` is reported as it is; delete the branch it left and move the half-made folder to the trash.")"; echo "skill-forbids=$(n SKILL.md | grep -cF "A project whose CLAUDE.md forbids branches in the main checkout gets a \`Needs you\` line instead.")"; echo "tracker-close=$(n references/tracker.md | grep -cF "When the task ran on a branch in the main checkout, there is no worktree: switch the main checkout back to the default branch first.")"; echo "tracker-delete=$(n references/tracker.md | grep -c "local branch and remote branch, unasked, once \`HEAD\` matches the merged PR.s head")";echo "gb-count=$(n SKILL.md | grep -o "30 GB" | wc -l | tr -d " ")$(n references/tracker.md | grep -o "30 GB" | wc -l | tr -d " ")"'
  prompt: |
    Say what the assistant does before creating a task's worktree when the disk is short on space, how it runs that task, what happens to other tasks and to the main checkout's uncommitted changes, how Close ends it, and what a project that forbids branches in the main checkout gets.
context:
  scaffold_script: fixture.sh
