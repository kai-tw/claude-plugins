schema_version: "1.1"
name: settings-by-judgment
description: The project config reference documents only rules and architecture; nothing the plugin ships outside evals/ names the config fields coverage or render, asst-intake or intake.sh. SKILL.md reads task sources from the project CLAUDE.md and names an unreadable one with its reason, no longer lists five fixed KB modules, says the model finds the coverage and screenshot commands itself, and with no screenshot command the builder says so and the assistant asks the user once.
tags: [config, assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    List the fields the assistant's project config reference documents, say whether the plugin still names the coverage or render config fields or asst-intake, and quote how the assistant finds the coverage command and the screenshot command, and which knowledge-base modules it works with.
context:
  scaffold_script: fixture.sh
