schema_version: "1.1"
name: screens-artifact
description: At the screen review the assistant publishes the screens page as an Artifact and sends its link; it never sends the file itself, and asks one question: OK, or which numbered image is wrong. The rule lives in references/screen-review.md, which SKILL.md points to at that step.
tags: [assistant, asst-screens]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: f="$root/skills/assistant/SKILL.md"; r="$root/skills/assistant/references/screen-review.md"; echo "senduserfile=$(cat "$f" "$r" | grep -c "SendUserFile")"; echo "skill-points=$(grep -c "references/screen-review\.md" "$f")"; tr -s " \n" " " < "$r" | grep -ci "publish the page \`asst-screens\` built .*with the \`Artifact\` tool" | sed "s/^/artifact=/"; tr -s " \n" " " < "$r" | grep -ci "ask one question: OK, or which numbered image is wrong" | sed "s/^/oneq=/"
  prompt: |
    Say how the assistant shows the user the screen-review page and what it asks.
context:
  scaffold_script: fixture.sh
