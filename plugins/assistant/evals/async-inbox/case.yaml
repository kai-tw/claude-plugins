schema_version: "1.1"
name: async-inbox
description: SKILL.md never tells the assistant to use AskUserQuestion and says the questions go at the end of the turn. references/inbox.md covers when to use the Inbox (judged from the user's habits), finding the existing Inbox by title or publishing one, reading it with Artifact and republishing it at the same URL to watch it, writing questions to its db with project and task, reading the answer after the wake and listing answers on every scheduler pass while a question is up, and irreversible actions as notice-only cards with no button. The plugin ships the Inbox page; run against a fake window.claude, every question card has a textarea (a question with no options is answered by text), one send button below the cards writes answers/<id> for each answered question and wakes Claude once with all their ids, a wake failure stays in the bottom bar across a re-render, a save failure is shown and send re-enabled, unreadable answers hide send, a notice card has no input or button, only an https link renders,, a question whose id is `constructor` or `toString` renders unanswered and its note is saved, a chosen option and a typed note stay filled in after a re-render and after a failed save, a viewer who is not the owner has no send button and only disabled fields, a null db shows "can’t connect" and no card, and a question id outside [A-Za-z0-9_-]{1,64} is never sent and the bar says nothing was sent.
tags: [assistant, inbox]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Say how the assistant asks the user a question that needs them, what the Inbox reference covers, and what the Inbox page the plugin ships does when a question is submitted and when a card is only a notice.
context:
  scaffold_script: fixture.sh
