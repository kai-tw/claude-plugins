schema_version: "1.1"
name: model-pins
description: The leader picks the builder's model per dispatch — haiku for exempt, sonnet by default, opus for a finding a previous fix round didn't clear; the verifier stays on opus.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: for a in builder verifier; do sed -n "s/^model: /$a-default=/p" "$root/agents/$a.md"; done; sed -n "/^- Pin the model at/,/verifier opus\./p" "$root/skills/assistant/SKILL.md" | tr -s " \n" " " | sed "s/^/pin=/"
  prompt: |
    Say which model each assistant agent runs on by default, how the assistant picks the builder's model, and which model it pins for the verifier.
context:
  scaffold_script: fixture.sh
