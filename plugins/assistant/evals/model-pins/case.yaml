schema_version: "1.1"
name: model-pins
description: Every dispatch pins its model: the verifier on opus, the tester on sonnet.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: for a in tester verifier; do sed -n "s/^model: /$a-default=/p" "$root/agents/$a.md"; done; sed -n "/^- Pin the model at/,/tester sonnet\./p" "$root/skills/assistant/SKILL.md" | tr -s " \n" " " | sed "s/^/pin=/"
  prompt: |
    Say which model each assistant agent runs on by default, and which model the skill pins for each.
context:
  scaffold_script: fixture.sh
