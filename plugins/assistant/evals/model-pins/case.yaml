schema_version: "1.1"
name: model-pins
description: The leader pins the model and the effort at every dispatch, after Anthropic's guidance — the builder haiku/low for exempt or exact edits, sonnet/medium for a clear-scope phase, sonnet/high for fix, opus/high for ambiguous work or a finding a previous fix round didn't clear, one step up on the evidence; tester sonnet/medium, verifier opus/high, and each agent's own effort when the Agent tool takes none.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: for a in builder tester verifier; do sed -n -e "s/^model: /$a-default=/p" -e "s/^effort: /$a-effort=/p" "$root/agents/$a.md"; done; sed -n "/^- Pin the model and the effort/,/own .effort. applies\./p" "$root/skills/assistant/SKILL.md" | tr -s " \n" " " | sed "s/^/pin=/"
  prompt: |
    Say which model and effort each assistant agent runs on by default, and how the assistant picks the model and effort at each dispatch.
context:
  scaffold_script: fixture.sh
