schema_version: "1.1"
name: model-pins
description: The leader pins the smallest model and effort that can do the work at every dispatch, after Anthropic's guidance; the agents' own defaults live in their frontmatter, not in a per-phase table in SKILL.md — builder sonnet/medium, tester sonnet/medium, verifier opus/high.
tags: [agents]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: for a in builder tester verifier; do sed -n -e "s/^model: /$a-default=/p" -e "s/^effort: /$a-effort=/p" "$root/agents/$a.md"; done; tr -s " \n" " " < "$root/skills/assistant/SKILL.md" | grep -o "Pin the smallest model and effort that can do the work" | sed "s/^/pin=/"
  prompt: |
    Say which model and effort each assistant agent runs on by default, and whether the assistant pins the smallest model and effort that can do the work.
context:
  scaffold_script: fixture.sh
