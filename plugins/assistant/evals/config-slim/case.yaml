schema_version: "1.1"
name: config-slim
description: Nothing in the plugin outside evals/ reads or documents a removed config field, asst-pr or asst-device; SKILL.md asks before every destructive or outward action and leaves project-specific ones to the project's CLAUDE.md.
tags: [config, assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Read, Grep, Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Say whether anything in the plugin still mentions a removed config field or tool, and quote the rule on destructive actions.
context:
  scaffold_script: fixture.sh
