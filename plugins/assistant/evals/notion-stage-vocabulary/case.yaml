schema_version: "1.1"
name: notion-stage-vocabulary
description: All 7 labels of SKILL.md's board Stage mapping are among the Stage options of the embedded tasklist schema.
tags: [asst-notion]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: asst-notion schema tasklist
  prompt: |
    Print the tasklist DB's embedded schema (without connecting to Notion) and confirm the Stage options include Product Plan, Engineering Plan, Design Plan, Implementation, Review, QA, Shipped.
context:
  scaffold_script: fixture.sh
