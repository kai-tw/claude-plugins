schema_version: "1.1"
name: pack-by-paths
description: --paths picks language files by extension — .ts and .mjs bring only js.md, not dart.md, with the charter first.
tags: [style-pack]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: style-pack --paths lib/a.ts lib/b.mjs
  prompt: |
    Print the style-code rules a review of lib/a.ts and lib/b.mjs should cite.
context:
  scaffold_script: fixture.sh
