schema_version: "1.1"
name: lean-skill
description: The assistant skill and its three agents load only what every task needs. SKILL.md stays under 15 500 bytes (and under 21 000), the builder and the verifier under 7 000 each, the tester under 3 620, the four under 32 000 together. Step-specific detail (the screen review, the sub-task split, the brief-review proportion check, the investigation's citation format, the PR) lives in the reference or form read at that step, every reference SKILL.md points to exists, nothing a script, a form or another file already states is restated in SKILL.md or an agent, and the three agents load the user's language rules with the same sentence.
tags: [assistant]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 2
  allowed_tools: [Bash]
  env:
    EVAL_CMD: s="$root/skills/assistant/SKILL.md"; a="$root/agents"; n() { tr -s " \n" " " < "$root/$1"; }; echo "bytes-under-21k=$(( $(wc -c < "$s") < 21000 ))"; echo "skill-bytes-under-15500=$(( $(wc -c < "$s") < 15500 ))"; for x in builder=7000 tester=3620 verifier=7000; do b=$(wc -c < "$a/${x%=*}.md"); [ "$b" -lt "${x#*=}" ] || echo "agent-over=${x%=*} $b"; done; echo "total-under-32k=$(( $(cat "$s" "$a/builder.md" "$a/tester.md" "$a/verifier.md" | wc -c) < 32000 ))"; for r in $(grep -oE "references/[a-z-]+\.md" "$s" | grep -v pr-checks | sort -u); do test -f "$root/skills/assistant/$r" || echo "missing=$r"; done; t=$(n skills/assistant/SKILL.md); for p in "2–3 side-by-side options" "mother-tongue-rules" "every write re-reads and verifies" "they are not restated here" "The parent is never dispatched" "Mark each \`Needs you\` line with the choice made" "removing the \`not implemented yet\` skip" "on svn a diff saved under" "it passes when every changed line executed" "every scenario has an implemented test" "a check that read files the branch never got" "a \`skip\` line means that source is" "says how it loads that language" "report is also posted to the task" "neither can ask you a question" "the survivors are in the engine" "What outlives it was written earlier" "Claude Code before 2.1.292" "so its context keeps growing" "You never read a plan body" "publish the page with the \`Artifact\` tool"; do echo "restated: $p = $(grep -cF "$p" <<< "$t")"; done; for x in "agents/builder.md|it pushes and keeps the" "agents/builder.md|The verifier checks against it, comments are its S6" "agents/builder.md|is reused word for word" "agents/builder.md|A concept the OS or app store owns" "agents/builder.md|never make a choice a draft there made" "agents/builder.md|it numbers rounds itself" "agents/builder.md|relative to the worktree root" "agents/tester.md|scenario nobody implemented" "agents/verifier.md|failure scenario · Fix" "agents/verifier.md|[U<N>.k] <key>" "agents/verifier.md|also report the row the delivery summary needs" "agents/verifier.md|They are not findings, not scored" "agents/verifier.md|Do not re-derive" "agents/verifier.md|Then check proportion" "agents/verifier.md|fewer NEW things"; do echo "restated: $x = $(n "${x%%|*}" | grep -cF "${x#*|}")"; done; for x in "skills/assistant/SKILL.md|A failed verify is reported as failed." "skills/assistant/SKILL.md|more than 5 \`Needs you\` questions" "skills/assistant/references/brief.md|The parent is never dispatched" "skills/assistant/references/brief.md|The split itself is a \`Decided\` in the first brief" "skills/assistant/forms/investigation.md|relative to the worktree root" "agents/verifier.md|governs the prose you write" "skills/assistant/references/brief.md|Status=Next"; do echo "kept: $x = $(n "${x%%|*}" | grep -cF "${x#*|}")"; done; echo "kept: SKILL.md|Mutation runs only in the PR.s CI. = $(n skills/assistant/SKILL.md | grep -c "Mutation runs only in the PR.s CI\.")"; echo "same-language-line=$(grep -lF "exit 1 means that language has no rules; if the command is not found, stop and report it — do not search for the file yourself." "$root"/agents/*.md | wc -l | tr -d " ")"
  prompt: |
    Say how big the assistant skill and its agents are, whether every reference it names exists, and whether they restate what scripts, forms or other files already say.
context:
  scaffold_script: fixture.sh
