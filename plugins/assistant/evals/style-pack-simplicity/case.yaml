schema_version: "1.1"
name: style-pack-simplicity
description: style-pack does not push extra layers — precedence says the more specific rule wins (project over language over core), S16.1 outranks any rule whose fix adds a layer, wrapper, type, file, callback or parameter the code does not need today, there are no exemption clauses or "apply the higher rule" burden of proof, S2 does not blanket-mark violations CRITICAL, no rule or agent file names a deleted id, and the builder and verifier agents never tell a unit to grow a named option.
tags: [style-pack]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: bash check.sh "$root"
  prompt: |
    Print the style-pack precedence section and list every leftover of the removed exemption, burden-of-proof and always-CRITICAL wording, every deleted rule id still named in a skill or agent file, and every "named option" left in the builder and verifier.
context:
  scaffold_script: fixture.sh
