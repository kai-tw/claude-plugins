schema_version: "1.1"
name: dry-run
description: Dry run by default; a directory with no project only reports that there is nothing to clean.
tags: [hooks]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 4
  allowed_tools: [Bash]
  env:
    EVAL_CMD: reclaim-space --project-only
  prompt: |
    Run reclaim-space --project-only (without --yes) in a directory with no project; print the output.
context:
  scaffold_script: fixture.sh
