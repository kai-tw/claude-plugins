schema_version: "1.1"
name: plan-lint-mod-file-missing
description: MOD 列指向 repo 不存在的 `lib/missing_store.dart` → FAIL 指名該檔。
tags: [plan-lint]
plugins: ["../.."]
runs: 1
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Bash]
  env:
    EVAL_CMD: plan-lint plan.md
  prompt: |
    這個工作目錄有一份工程計畫 plan.md 和它描述的 repo。檢查計畫：§Classes 每個 NEW 列的 `為何要新增` 是否作答、每個 (MOD)/(DEL) 檔案是否存在於 repo。有可用的 lint 就用它。
    最後一行給 verdict：PASS 或 FAIL；FAIL 要指出哪一列、為什麼。
context:
  scaffold_script: fixture.sh
