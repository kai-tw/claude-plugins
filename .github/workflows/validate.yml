name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version-bump check diffs against a base commit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Repo-level checks. `claude plugin validate` covers each manifest against
      # the schema; this covers what it does not — a marketplace source pointing
      # nowhere, a name disagreement between a marketplace entry and its plugin,
      # a skill with no description, an absolute machine path, an unlisted
      # plugin, and README install commands that no longer match.
      - name: Repo checks
        run: node .github/scripts/validate.mjs

      # Well-formed is not working: every changed plugin's evals must pass, and
      # a changed plugin with code must have evals at all.
      - name: Evals
        run: node .github/scripts/run-evals.mjs --base "${{ github.event.pull_request.base.sha || 'HEAD^' }}"

      # A plugin whose files change must change its version: installs are cached
      # per version, so an unbumped change is served stale and never reaches
      # anyone. Verified the hard way — dart-lsp shipped without its skill.
      # always(): on a PR the bump comes last, once the evals pass, so this is
      # expected to fail until then and must not hide the Evals result.
      - name: Version bump check
        if: always()
        run: node .github/scripts/check-version-bump.mjs "${{ github.event.pull_request.base.sha || 'HEAD^' }}"

  # The whole history takes under a second, so every run scans all of it
  # instead of working out a commit range. Same scanner as .githooks/pre-commit.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks

      - name: Scan for secrets
        run: ./gitleaks git --redact --no-banner --verbose .
