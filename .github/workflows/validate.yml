name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Repo-level checks. `claude plugin validate` covers each manifest against
      # the schema; this covers what it does not — a marketplace source pointing
      # nowhere, a name disagreement between a marketplace entry and its plugin,
      # a skill with no description, an absolute machine path, an unlisted
      # plugin, and README install commands that no longer match.
      - name: Repo checks
        run: node .github/scripts/validate.mjs
