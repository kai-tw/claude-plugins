name: plugin-tag

# Tag every plugin version that reached `main` untagged.
#
# WHY A WORKFLOW AND NOT ONLY THE LOCAL RELEASE SCRIPT
#   The tag is what a consumer installs from, so a version that lands on `main`
#   without one leaves every consumer on the previous release with nothing
#   saying so. Two ordinary routes produce exactly that: a bump merged through
#   a pull request, and a cloud session — where the GitHub authorization
#   refuses a tag push outright (403), so the release simply cannot be finished
#   by hand from there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Back-to-back pushes start one run each. Queue them rather than cancel: a
# cancelled run could be the only one that saw its version.
concurrency:
  group: plugin-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates and pushes the tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags themselves

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A tag is the statement that a version is final; it must not land on a
      # tree that fails the structural checks. Re-running the script costs
      # seconds and keeps this job's ref unambiguous — chaining on the
      # `validate` workflow's result would mean a `workflow_run` event, where
      # the commit that triggered it and the commit that gets checked out are
      # two different things.
      - name: Repo checks
        run: node .github/scripts/validate.mjs

      - name: Create the missing tags
        id: plan
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node .github/scripts/plugin-tags.mjs --create

      - name: Push them
        if: steps.plan.outputs.tags != ''
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
        # One tag per push, so a tag another run already pushed cannot take the
        # rest down with it. Already on the remote at the same commit is that
        # other run's success; at a different commit it is one version naming
        # two trees, and fails. Through env rather than `${{ }}` so the value
        # stays an argument instead of becoming shell syntax.
        run: |
          set -uo pipefail
          fail=0
          for t in $TAGS; do
            git push origin "refs/tags/$t" && continue
            ours=$(git rev-parse "$t^{commit}")
            theirs=$(git ls-remote origin "refs/tags/$t^{}" | cut -f1)
            if [ "$theirs" = "$ours" ]; then
              echo "✔ $t is already on the remote at ${ours:0:7}"
            else
              echo "::error::$t is on the remote at ${theirs:-?}, this run tagged $ours"
              fail=1
            fi
          done
          exit $fail
